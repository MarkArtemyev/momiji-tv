<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momiji</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="defs" width="0" height="0" aria-hidden="true">
  <defs>
    <path id="leaf" d="M50 5L58 25L70 18L67 38L88 30L80 48L95 52L76 63L80 75L60 70L55 88L52 88L52 97L48 97L48 88L45 88L40 70L20 75L24 63L5 52L20 48L12 30L33 38L30 18L42 25Z"/>
  </defs>
</svg>

<div id="scene" aria-hidden="true">
  <svg id="sky" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2b1b3d"/>
        <stop offset=".36" stop-color="#6b3a5e"/>
        <stop offset=".64" stop-color="#d9685a"/>
        <stop offset=".84" stop-color="#f6a65b"/>
        <stop offset="1" stop-color="#ffd08a"/>
      </linearGradient>
      <radialGradient id="g-sun">
        <stop offset="0" stop-color="#fff1c9"/>
        <stop offset=".22" stop-color="#ffd08a" stop-opacity=".9"/>
        <stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="g-far" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9a5268"/>
        <stop offset="1" stop-color="#5a2e4a"/>
      </linearGradient>
      <linearGradient id="g-near" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5a2e4a"/>
        <stop offset="1" stop-color="#341a30"/>
      </linearGradient>
      <linearGradient id="g-hill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2e1528"/>
        <stop offset="1" stop-color="#1b1020"/>
      </linearGradient>
    </defs>

    <rect width="960" height="540" fill="url(#g-sky)"/>

    <g fill="#fff3e0">
      <circle class="tw" cx="80" cy="40" r="1.4"/>
      <circle class="tw d1" cx="170" cy="92" r="1"/>
      <circle class="tw d2" cx="260" cy="30" r="1.2"/>
      <circle class="tw d3" cx="350" cy="74" r="1"/>
      <circle class="tw d1" cx="430" cy="22" r="1.5"/>
      <circle class="tw d2" cx="520" cy="60" r="1"/>
      <circle class="tw d3" cx="600" cy="18" r="1.2"/>
      <circle class="tw" cx="40" cy="120" r="1"/>
      <circle class="tw d2" cx="300" cy="140" r="0.9"/>
    </g>

    <g fill="#ffcf9e" opacity=".22">
      <ellipse cx="190" cy="250" rx="170" ry="13"/>
      <ellipse cx="300" cy="270" rx="120" ry="8"/>
      <ellipse cx="780" cy="236" rx="150" ry="11"/>
      <ellipse cx="660" cy="300" rx="110" ry="7"/>
    </g>

    <circle id="glow" cx="690" cy="398" r="170" fill="url(#g-sun)"/>
    <circle cx="690" cy="398" r="34" fill="#fff4d6" opacity=".95"/>

    <path d="M0 412L70 372L140 394L230 342L320 386L410 352L510 398L600 362L690 396L780 352L870 386L960 360V540H0Z" fill="url(#g-far)" opacity=".9"/>
    <path d="M0 452Q120 404 230 438T470 430T720 448T960 424V540H0Z" fill="url(#g-near)"/>
    <path d="M520 540V482Q640 442 780 454Q880 462 960 486V540Z" fill="url(#g-hill)"/>

    <g fill="#1b0d18" transform="translate(712 404)">
      <path d="M-50 0Q0 -11 50 0L52 8H-52Z"/>
      <rect x="-42" y="17" width="84" height="6"/>
      <rect x="-33" y="6" width="7" height="58"/>
      <rect x="26" y="6" width="7" height="58"/>
      <rect x="-3" y="8" width="6" height="10"/>
    </g>

    <g transform="translate(960 0) scale(-1 1)">
      <path d="M-20 64C80 54 160 86 260 66S380 36 440 58" stroke="#2a1420" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M140 76C168 104 180 126 212 138" stroke="#2a1420" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M300 52C320 82 348 94 372 118" stroke="#2a1420" stroke-width="3" fill="none" stroke-linecap="round"/>
      <use href="#leaf" fill="#e2513a" transform="translate(20 46) rotate(-20) scale(.42)"/>
      <use href="#leaf" fill="#ff7a3d" transform="translate(58 28) rotate(15) scale(.38)"/>
      <use href="#leaf" fill="#c73a3a" transform="translate(84 62) rotate(-40) scale(.44)"/>
      <use href="#leaf" fill="#ffb347" transform="translate(110 36) rotate(30) scale(.34)"/>
      <use href="#leaf" fill="#e2513a" transform="translate(130 70) rotate(5) scale(.4)"/>
      <use href="#leaf" fill="#f08a3c" transform="translate(162 100) rotate(-25) scale(.36)"/>
      <use href="#leaf" fill="#d94a2b" transform="translate(190 120) rotate(40) scale(.38)"/>
      <use href="#leaf" fill="#ff7a3d" transform="translate(168 44) rotate(-10) scale(.4)"/>
      <use href="#leaf" fill="#c73a3a" transform="translate(206 66) rotate(20) scale(.42)"/>
      <use href="#leaf" fill="#ffb347" transform="translate(236 38) rotate(-35) scale(.36)"/>
      <use href="#leaf" fill="#e2513a" transform="translate(262 72) rotate(10) scale(.4)"/>
      <use href="#leaf" fill="#f08a3c" transform="translate(292 30) rotate(25) scale(.38)"/>
      <use href="#leaf" fill="#d94a2b" transform="translate(316 62) rotate(-15) scale(.42)"/>
      <use href="#leaf" fill="#ff7a3d" transform="translate(338 92) rotate(35) scale(.34)"/>
      <use href="#leaf" fill="#ffcf6b" transform="translate(356 112) rotate(-5) scale(.3)"/>
      <use href="#leaf" fill="#e2513a" transform="translate(360 30) rotate(15) scale(.36)"/>
      <use href="#leaf" fill="#c73a3a" transform="translate(396 50) rotate(-30) scale(.34)"/>
      <use href="#leaf" fill="#ffb347" transform="translate(-6 74) rotate(45) scale(.34)"/>
    </g>
  </svg>
  <div id="stage">
    <div id="art"></div>
    <div id="rays"></div>
    <div id="sun"></div>
    <div id="mist"><i class="m1"></i><i class="m2"></i></div>
  </div>
  <div id="birds"></div>
  <div id="sparks"></div>
  <div id="leaves"></div>
</div>

<main>
  <header>
    <div id="time">--:--</div>
    <div class="sep"></div>
    <div class="when">
      <div id="greet"><span class="ru"></span><span class="jp"></span></div>
      <div id="date"></div>
    </div>
  </header>

  <div class="eyebrow"><span class="live-dot"></span> ТВОЁ ОКНО В ИНТЕРНЕТ <span class="edition">TV EDITION / 02</span></div>

  <div class="searchrow">
    <button id="search" class="nav search">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <span>Найти или ввести адрес</span>
    </button>
    <button id="voice" class="nav round" aria-label="Голосовой поиск">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
    </button>
  </div>

  <section id="tiles" class="grid"></section>

  <section id="recentWrap" hidden>
    <h2>Недавно</h2>
    <div id="recent" class="row"></div>
  </section>

  <footer>
    <button id="remote" class="nav chip">⌨ Пульт с ПК</button>
    <button id="agent" class="nav chip">✦ Пульт ИИ</button>
    <button id="engine" class="nav chip">Поиск: Google</button>
    <span class="tips">ОК открыть · зажми ОК для меню</span>
    <div class="brand"><span class="jp">もみじ</span><span class="en">Momiji</span></div>
  </footer>
</main>

<div id="confirm" hidden>
  <div class="card">
    <p id="confirmText"></p>
    <div class="btns">
      <button id="yes" class="nav danger">Убрать</button>
      <button id="no" class="nav">Оставить</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
